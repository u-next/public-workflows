name: betterleaks
on:
  pull_request:
  merge_group:
  workflow_dispatch:
jobs:
  scan:
    name: betterleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # $/ (not ./) runs the action from this repo at the workflow's own commit, also when
      # injected by an org ruleset, so it needs no tag or actions.lock entry.
      - uses: $/.github/actions/betterleaks
        with:
          config: ${{ vars.GITLEAKS_CONFIG }}
